[project]
name = "terraform-agentcore"
version = "0.1.0"
description = "Bedrock AgentCoreを使用したAIエージェントのデプロイメントプロジェクト"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "kamo-shika" }]
requires-python = ">=3.13"
dependencies = [
    "bedrock-agentcore[strands-agents]>=1.1.2",
    "boto3[crt]>=1.42.19",
    "strands-agents-tools>=0.2.18",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aws-opentelemetry-distro>=0.12.2",  # AgentCore Observability用
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.25.2",
    "ruff>=0.9.0",
    "httpx>=0.28.0",
    "strands-agents-evals>=0.1.0",  # LLM-as-a-Judge評価フレームワーク
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (line-lengthで管理)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
